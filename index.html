<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'">
<title>Экспресс-анализ для КМ</title>
<style>:root {
  --paper: #F3F6F6; --surface: #FFFFFF; --ink: #17262E; --muted: #5B6B73; --rule: #D5DDE0; --rule-soft: #E7ECEE;
  --teal: #0E5A66; --teal-ink: #0A4650; --teal-soft: #E1EEF0;
  --in-bg: #FFF7D6; --in-ink: #1F4FB8;
  --ok: #2F7A4B; --ok-bg: #E2F1E7; --chk: #9A5B00; --chk-bg: #FBF0D6; --risk: #B9410C; --risk-bg: #FCE6DA;
  --crit: #9B1C3A; --crit-bg: #F7DCE3; --nd: #66727A; --nd-bg: #ECEFF1;
  --serif: "Lora", Georgia, "Times New Roman", serif;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r: 8px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 26px; line-height: 1.2; }
h2 { font-size: 19px; line-height: 1.3; }
h3 { font-size: 15.5px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.hidden { display: none !important; }

/* кнопки */
.btn { border: 1px solid var(--rule); background: var(--surface); padding: 8px 14px; border-radius: var(--r); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #AEBCC1; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-ink); }
.btn.ghost { background: none; border-color: transparent; color: var(--teal); padding-left: 6px; padding-right: 6px; }
.btn.danger { color: var(--crit); }
.btn.big { padding: 12px 20px; font-size: 15px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* главная */
.home { max-width: 1040px; margin: 0 auto; padding: 36px 20px 60px; }
.hero { background: var(--teal-ink); color: #DCEBEC; border-radius: 14px; padding: 30px 30px 26px; margin-bottom: 22px; }
.hero h1 { color: #fff; font-size: 30px; }
.hero p { max-width: 68ch; margin-top: 10px; color: #BFD9DB; }
.hero .row { margin-top: 18px; }
.hero .btn { border-color: transparent; }
.hero .btn.primary { background: #fff; color: var(--teal-ink); font-weight: 600; }
.hero .btn.alt { background: #135560; color: #fff; }
.how { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 0 0 26px; }
.how div { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: var(--r); padding: 12px; }
.how b { display: block; font-family: var(--serif); color: var(--teal-ink); margin-bottom: 2px; }
.how span { font-size: 12.5px; color: var(--muted); }
.clist { display: grid; gap: 8px; }
.citem { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: var(--r); padding: 12px 14px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
.citem:hover { border-color: #AEBCC1; }
.citem .nm { flex: 1; min-width: 0; }
.citem .nm b { display: block; }
.empty { background: var(--surface); border: 1px dashed var(--rule); border-radius: var(--r); padding: 22px; text-align: center; color: var(--muted); }

/* клиент */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.rail { background: var(--teal-ink); color: #DCEBEC; padding: 20px 14px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { font-family: var(--serif); font-size: 17px; color: #fff; line-height: 1.25; padding: 0 8px; }
.brand small { display: block; font-family: var(--sans); font-size: 12px; color: #9EC3C7; margin-top: 3px; }
.rail .client { padding: 10px 8px; border-top: 1px solid #1F6670; border-bottom: 1px solid #1F6670; }
.rail .client b { color: #fff; display: block; font-weight: 600; word-break: break-word; }
.rail .client button { background: none; border: 0; color: #9EC3C7; padding: 0; cursor: pointer; font-size: 12.5px; margin-top: 4px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { margin: 2px 0; }
.steps button { width: 100%; text-align: left; background: none; border: 0; color: #DCEBEC; padding: 9px 26px 9px 38px; border-radius: var(--r); cursor: pointer; position: relative; }
.steps button::before { counter-increment: s; content: counter(s); position: absolute; left: 9px; top: 9px; width: 21px; height: 21px; border-radius: 50%; border: 1px solid #4E8C93; font-size: 11.5px; display: grid; place-items: center; color: #BFD9DB; }
.steps button:hover { background: #135560; }
.steps button[aria-current="page"] { background: var(--paper); color: var(--teal-ink); font-weight: 600; }
.steps button[aria-current="page"]::before { border-color: var(--teal); color: var(--teal); }
.steps .dot { position: absolute; right: 10px; top: 16px; width: 8px; height: 8px; border-radius: 50%; }
.dot.ok { background: #5FBF85; } .dot.chk { background: #E2A93B; } .dot.risk, .dot.crit { background: #E5664A; } .dot.nd { background: #6E8C92; }
.rail .foot { margin-top: auto; font-size: 12px; color: #9EC3C7; padding: 0 8px; }
.main { min-width: 0; padding: 26px 32px 70px; }
.pagehead { margin-bottom: 18px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.pagehead .lead { flex: 1 1 420px; }
.pagehead p { color: var(--muted); max-width: 76ch; margin-top: 6px; }

/* панели и формы */
.panel { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
.panel > h2, .panel > h3 { margin-bottom: 4px; }
.panel .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: 12.5px; color: var(--muted); }
.fld > span i { font-style: normal; color: #8A979D; }
.inp, select.inp, textarea.inp { border: 1px solid var(--rule); background: var(--in-bg); color: var(--in-ink); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
.inp:focus { background: #fff; border-color: var(--teal); outline: none; }
.inp.num { text-align: right; }
textarea.inp { min-height: 70px; resize: vertical; line-height: 1.5; }
.fld.wide { grid-column: 1 / -1; }
.calcbox { background: var(--teal-soft); color: var(--teal-ink); border-radius: 6px; padding: 8px 10px; font-weight: 600; }

/* таблицы */
.tw { overflow-x: auto; }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 6px 9px; border-bottom: 1px solid var(--rule-soft); text-align: right; vertical-align: middle; }
table.t thead th { background: #E9EFF0; font-weight: 600; color: var(--teal-ink); border-bottom: 1px solid var(--rule); font-size: 12.5px; }
table.t .l { text-align: left; }
table.t tr.sec td { background: var(--teal-soft); color: var(--teal-ink); font-weight: 600; text-align: left; font-size: 12.5px; }
table.t tr.tot td { background: #F1F4F5; font-weight: 600; }
table.t td.c { padding: 0; }
table.t td.c .inp { border-radius: 0; border: 0; border-left: 1px solid #F4E7B0; min-width: 100px; text-align: right; }
table.t td.c select.inp, table.t td.c .inp.txt { text-align: left; }
table.t td .note { display: block; font-size: 12px; color: var(--muted); }
table.t .neg { color: var(--crit); }
table.t td.x { width: 34px; padding: 0 4px; }
.xbtn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 6px; }
.xbtn:hover { color: var(--crit); }

/* загрузка */
.drop { border: 2px dashed #A9C4C8; border-radius: 10px; padding: 22px; text-align: center; background: #F8FBFB; color: var(--teal-ink); }
.drop.on { background: var(--teal-soft); border-color: var(--teal); }
.drop b { display: block; font-size: 15px; margin-bottom: 4px; }
.flist { margin-top: 12px; display: grid; gap: 6px; }
.fitem { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; padding: 8px 10px; border-radius: 6px; background: #F6F8F8; }
.fitem .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 22px; font-size: 12px; font-weight: 700; }
.fitem.ok .ic { background: var(--ok-bg); color: var(--ok); } .fitem.err .ic { background: var(--crit-bg); color: var(--crit); }
.fitem .fn { flex: 1; min-width: 0; } .fitem .fn b { word-break: break-all; }

/* статусы */
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.chk { background: var(--chk-bg); color: var(--chk); }
.tag.risk { background: var(--risk-bg); color: var(--risk); } .tag.crit { background: var(--crit-bg); color: var(--crit); } .tag.nd { background: var(--nd-bg); color: var(--nd); }

/* анализ */
.verdict { border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; display: flex; gap: 16px; align-items: flex-start; border: 1px solid; }
.verdict .big { font-family: var(--serif); font-size: 21px; font-weight: 600; }
.verdict p { margin: 6px 0 0; }
.verdict.ok { background: var(--ok-bg); border-color: #BBDDC6; color: #1F5A35; }
.verdict.chk { background: var(--chk-bg); border-color: #EBD49C; color: #6E4100; }
.verdict.risk { background: var(--risk-bg); border-color: #F1BFA6; color: #8A300A; }
.verdict.crit { background: var(--crit-bg); border-color: #E7AFBE; color: #7A142D; }
.verdict.nd { background: var(--nd-bg); border-color: var(--rule); color: var(--ink); }
.vicon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 700; background: rgba(255,255,255,.65); flex: 0 0 40px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: 10px; padding: 14px 16px; border-top: 4px solid var(--nd); }
.kpi.ok { border-top-color: #5FBF85; } .kpi.chk { border-top-color: #E2A93B; } .kpi.risk { border-top-color: #E5664A; } .kpi.crit { border-top-color: var(--crit); }
.kpi .k { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.kpi .v { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 4px 0 2px; }
.kpi .v small { font-family: var(--sans); font-size: 13px; font-weight: 400; color: var(--muted); }
.kpi .e { font-size: 12.5px; color: #34464F; }
.kpi .n { font-size: 12px; color: var(--muted); margin-top: 6px; border-top: 1px dashed var(--rule-soft); padding-top: 6px; }
.maxsum { display: flex; gap: 20px; flex-wrap: wrap; }
.maxsum > div { flex: 1 1 200px; }
.maxsum .v { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--teal-ink); }

/* проблемы */
.prob { background: var(--surface); border: 1px solid var(--rule-soft); border-left: 5px solid var(--nd); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
.prob.crit { border-left-color: var(--crit); } .prob.risk { border-left-color: #E5664A; } .prob.chk { border-left-color: #E2A93B; } .prob.ok { border-left-color: #5FBF85; }
.prob .hd { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.prob .hd b { font-size: 14.5px; }
.prob .area { font-size: 12px; color: var(--muted); margin-left: auto; }
.prob .why { margin: 6px 0 0; }
.prob .todo { margin-top: 6px; font-size: 13px; color: var(--teal-ink); background: var(--teal-soft); padding: 6px 10px; border-radius: 6px; }
.prob .todo::before { content: "Что сделать: "; font-weight: 600; }
.cnt { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

/* заключение */
.concl { font-family: var(--sans); width: 100%; min-height: 560px; border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; line-height: 1.6; background: #fff; color: var(--ink); resize: vertical; }
.concl:focus { outline: 2px solid var(--teal); outline-offset: -1px; }
.edited { font-size: 12px; color: var(--chk); }

/* подсказки */
.tip { position: relative; display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); font-size: 11px; font-weight: 700; cursor: help; }
.explain { background: #F7FAFA; border: 1px solid var(--rule-soft); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #34464F; margin-bottom: 14px; }
.explain b { color: var(--teal-ink); }

/* тост и диалог */
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: 90vw; }
#toast.on { opacity: 1; transform: translateX(-50%); }
.modal { position: fixed; inset: 0; background: rgba(15,30,36,.45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal .box { background: #fff; border-radius: 12px; padding: 20px 22px; max-width: 520px; width: 100%; }
.modal .box h3 { margin-bottom: 8px; }
.modal .row { margin-top: 14px; justify-content: flex-end; }

.mobbar { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; padding: 12px 16px; gap: 10px; }
  .rail .brand, .rail .foot { display: none; }
  .rail .client { border: 0; padding: 0; }
  .steps { display: flex; overflow-x: auto; gap: 4px; }
  .steps li { flex: 0 0 auto; }
  .steps button { white-space: nowrap; padding-right: 22px; }
  .main { padding: 18px 16px 60px; }
  .how { grid-template-columns: 1fr 1fr; }
  .hero { padding: 22px 18px; }
  .hero h1 { font-size: 24px; }
}

@media print {
  body { background: #fff; font-size: 12px; }
  .rail, .noprint, .btn, #toast { display: none !important; }
  .app { display: block; }
  .main { padding: 0; }
  .panel, .kpi, .prob { break-inside: avoid; border-color: #ccc; }
  .concl { display: none; }
  .printonly { display: block !important; white-space: pre-wrap; font-size: 12.5px; line-height: 1.55; }
}
.printonly { display: none; }
table.t td.c select.inp { min-width: 130px; }

    const dm = /(?:дата\s+(?:формирования|отчета|выдачи\s+отчета)|сформирован\S*)\D{0,20}(\d{2}\.\d{2}\.\d{4})/i.exec(txt);
    const binM = /(?:бин|иин)[^\d]{0,30}(\d{12})/i.exec(squeeze(L.slice(0, 40).map(l => l.text).join(" ")));
    const bureau = /первое\s+кредитное\s+бюро|пкб/i.test(txt) ? "ПКБ" : /государственн\S*\s+кредитн\S*\s+бюро|гкб/i.test(txt) ? "ГКБ" : "кредитное бюро";
    return { bureau, date: dm ? toISO(dm[1]) : "", bin: binM ? binM[1] : "", loans };
  }
  const isNum = v => typeof v === "number" && isFinite(v);

  /* ---------- Excel как «страница» из строк и ячеек — те же разборщики работают и для таблиц */
  function sheetToPdf(sheets) {
    const pages = [];
    for (const sh of sheets) {
      if (sh.hidden) continue;
      const lines = [];
      (sh.rows || []).forEach((row, ri) => {
        if (!row) return;
        const cells = [];
        row.forEach((v, ci) => {
          if (v === undefined || v === null || v === "") return;
          let s = v;
          if (typeof v === "number") s = String(v);
          s = String(s).replace(/\s+/g, " ").trim(); if (!s) return;
          cells.push({ x: ci * 100, x2: ci * 100 + 90, s, fs: 10 });
        });
        if (cells.length) lines.push({ y: -ri * 12, fs: 10, cells, text: cells.map(c => c.s).join("  ") });
      });
      pages.push({ lines });
    }
    return { pages, noText: false };
  }
  // даты Excel (число дней с 1899-12-30) в колонке «дата» превращаем в дд.мм.гггг
  function fixExcelDates(pdf) {
    for (const p of pdf.pages) {
      let dcol = null;
      for (const l of p.lines) {
        const h = stmtHeader(l);
        if (h) { const d = h.find(c => c.k === "date"); dcol = d ? d.x1 : null; continue; }
        for (const c of l.cells) if ((dcol !== null && c.x === dcol || c.x === 0) && /^\d{5}(\.\d+)?$/.test(c.s)) {
          const n = parseFloat(c.s); if (n > 30000 && n < 80000) { const d = new Date(Math.round((n - 25569) * 86400000)); c.s = `${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.${d.getUTCFullYear()}`; }
        }
        l.text = l.cells.map(c => c.s).join("  ");
      }
    }
    return pdf;
  }
  const pad = n => String(n).padStart(2, "0");

  function detect(pdf) {
    const nd = isDecl(pdf), ns = isStmt(pdf), nb = isBank(pdf), nc = isCredit(pdf);
    if (nc >= 6 && nc > nd && ns < 5) return "credit";
    if (nd >= 3 && nd * 2 >= nb) return "decl";
    if (ns >= 3) return "stmt";
    if (nb >= 3) return "bank";
    return nd >= 2 ? "decl" : ns >= 1 ? "stmt" : null;
  }
  async function read(buf) {
    const pdf = await PdfReader.read(buf);
    const kind = pdf.noText ? null : detect(pdf);
    return { pdf, kind, decl: kind === "decl" ? parseDecl(pdf) : null, bank: kind === "bank" ? parseBank(pdf) : null, stmt: kind === "stmt" ? parseStmt(pdf) : null, credit: kind === "credit" ? parseCredit(pdf) : null };
  }
  function readLines(pdf) {   // уже готовые строки (например, из HTML)
    const kind = detect(pdf);
    return { pdf, kind, decl: kind === "decl" ? parseDecl(pdf) : null, bank: kind === "bank" ? parseBank(pdf) : null, stmt: kind === "stmt" ? parseStmt(pdf) : null, credit: kind === "credit" ? parseCredit(pdf) : null };
  }
  function readSheets(sheets) {
    const pdf = fixExcelDates(sheetToPdf(sheets));
    const kind = detect(pdf);
    return { pdf, kind, decl: kind === "decl" ? parseDecl(pdf) : null, bank: kind === "bank" ? parseBank(pdf) : null, stmt: kind === "stmt" ? parseStmt(pdf) : null, credit: kind === "credit" ? parseCredit(pdf) : null };
  }
  return { read, readSheets, readLines, sheetToPdf, parseDecl, parseBank, parseStmt, parseCredit, classify, classifyDebit, DCATS, clean, pickKeys, isDecl, isBank, isStmt, monthLabel, headerSem, amt, toISO, FORMS, KEYS, CATS };
})();


/* ================================================================ Экспресс-анализ: расчёты, проблемы, вердикт.
   Пороговые значения собраны здесь, чтобы их легко было поменять под методику банка. */
const NORM = {
  dscr_ok: 1.25, dscr_min: 1.0,            // покрытие платежей
  lev_ok: 3.5, lev_max: 5,                 // долг / EBITDA (с новым кредитом)
  liq_ok: 1.0, liq_min: 0.7,               // текущая ликвидность
  eq_ok: 0.2, eq_min: 0.1,                 // доля собственного капитала
  coll_ok: 1.0, coll_min: 0.7,             // покрытие залогом (с гарантией фонда)
  rev_drop_chk: -0.1, rev_drop_risk: -0.2, // падение выручки
  age_min: 12,                             // минимальный срок деятельности, мес.
  wc_term: 36,                             // макс. срок для пополнения оборотных средств, мес.
  wc_share: 0.5,                           // сумма кредита к годовой выручке — проверить, если больше
  diff_pct: 0.1, diff_abs: 1000,           // расхождение: больше 10 % и больше 1 000 тыс. тг
};
const SEVW = { crit: 4, risk: 3, chk: 2, nd: 1, ok: 0 };
const SEVT = { crit: "Стоп-фактор", risk: "Риск", chk: "Проверить", nd: "Нет данных", ok: "Норма" };

/* ---------------------------------------------------------------- платёж по новому кредиту */
function loanPay(c = X.card) {
  const A = N(c.amount), n = Math.max(1, N(c.term) - N(c.grace)), r = N(c.rate) / 100 / 12;
  if (!A || !N(c.term)) return null;
  if (c.product === "Кредитная линия" || c.product === "Овердрафт") {
    // линия: считаем как кредит на срок (консервативно); овердрафт — только проценты
    if (c.product === "Овердрафт") return { pay: A * r, first: A * r, grace: 0, note: "только проценты (овердрафт гасится оборотами)" };
  }
  if (c.sched === "end") return { pay: A * r, first: A * r, grace: A * r, balloon: A, note: "ежемесячно только проценты, долг — одной суммой в конце срока" };
  if (c.sched === "diff") return { pay: A / n + A * r, first: A / n + A * r, grace: A * r, note: "первый платёж самый большой, потом уменьшается" };
  const p = r ? A * r / (1 - Math.pow(1 + r, -n)) : A / n;
  return { pay: p, first: p, grace: A * r, note: "равными платежами" };
}
// какую сумму можно обслуживать при заданном ежемесячном платеже (те же условия)
function amountForPay(pay, c = X.card) {
  if (!(pay > 0)) return 0;
  const n = Math.max(1, N(c.term) - N(c.grace)), r = N(c.rate) / 100 / 12;
  if (c.product === "Овердрафт" || c.sched === "end") return r ? pay / r : 0;
  if (c.sched === "diff") return pay / (1 / n + r);
  return r ? pay * (1 - Math.pow(1 + r, -n)) / r : pay * n;
}
const monthsBetween = (iso, ref = new Date()) => { const d = new Date(iso); if (!iso || isNaN(d)) return null; return (ref.getFullYear() - d.getFullYear()) * 12 + ref.getMonth() - d.getMonth(); };

/* ---------------------------------------------------------------- основной расчёт */
function analyze() {
  const c = X.card, P = X.per;
  const withRev = P.filter(p => isNum(fv("rev", p.id)));
  const withBal = P.filter(p => isNum(val("ta", p.id)));
  const pl = withRev[withRev.length - 1] || null, bal = withBal[withBal.length - 1] || null;
  const fulls = withRev.filter(p => N(p.months) === 12);
  const yr = fulls[fulls.length - 1] || null, yr0 = fulls[fulls.length - 2] || null;
  const k = pl ? 12 / (N(pl.months) || 12) : 1;             // перевод в годовое выражение
  const m = { pl, bal, yr, yr0, k };
  if (pl) {
    m.rev = fv("rev", pl.id) * k; m.ni = val("ni", pl.id) * k; m.ebit = val("ebit", pl.id) * k;
    m.da = fv("da", pl.id); m.daKnown = isNum(m.da); m.ebitda = val("ebitda", pl.id) * k;
    m.cit = N(fv("cit", pl.id)) * k; m.int = N(fv("int", pl.id)) * k;
    m.gm = m.rev ? (m.rev - N(fv("cogs", pl.id)) * k) / m.rev : null;
    m.nm = m.rev ? m.ni / m.rev : null;
    m.cashYear = m.ebitda - m.cit;                         // деньги, которые бизнес зарабатывает за год до платежей по кредитам
    m.cashMonth = m.cashYear / 12;
    m.ocf = fv("ocf", pl.id); if (isNum(m.ocf)) m.ocf *= k;
  }
  if (yr && yr0) { const a = fv("rev", yr0.id), b = fv("rev", yr.id); m.revGr = a ? b / a - 1 : null; }
  if (bal) {
    m.ta = val("ta", bal.id); m.eq = fv("eq", bal.id); m.debt = N(val("debt", bal.id));
    m.ca = val("ca", bal.id); m.cl = val("cl", bal.id);
    m.liq = m.cl ? m.ca / m.cl : null; m.eqr = m.ta ? N(m.eq) / m.ta : null;
  }
  // кредиты
  const loans = c.loans || [];
  m.loanBal = sum(loans.map(l => l.balance));
  m.payExist = sum(loans.filter(l => !l.refin).map(l => l.pay));
  m.refinBal = sum(loans.filter(l => l.refin).map(l => l.balance));
  m.newPay = loanPay();
  m.payTotal = m.payExist + (m.newPay ? m.newPay.pay : 0);
  if (isNum(m.cashMonth)) {
    m.dscr = m.payTotal > 0 ? m.cashMonth / m.payTotal : null;
    m.payFree = m.cashMonth / NORM.dscr_ok - m.payExist;    // сколько ещё можно платить в месяц с запасом 25 %
    m.maxAmt = Math.max(0, amountForPay(m.payFree));
  }
  m.debtNew = m.debt + N(c.amount) - m.refinBal;
  if (isNum(m.ebitda) && m.ebitda > 0) m.lev = m.debtNew / m.ebitda;
  // залог
  const coll = c.coll || [];
  m.collMkt = sum(coll.map(z => z.value));
  m.collDisc = sum(coll.map(z => N(z.value) * (1 - N(z.disc) / 100)));
  m.guarAmt = N(c.amount) * N(c.guarPct) / 100;
  m.coll = N(c.amount) ? (m.collDisc + m.guarAmt) / N(c.amount) : null;
  m.age = monthsBetween(c.regDate);
  return m;
}

/* ---------------------------------------------------------------- проблемы и расхождения */
function problems(m = analyze()) {
  const c = X.card, out = [];
  const add = (sev, area, title, why, todo) => out.push({ sev, area, title, why, todo });
  const T = v => fmt(v) + " тыс. тг";
  // полнота
  if (!c.name) add("nd", "Карточка", "Не указано наименование клиента", "Без названия заключение будет неполным.", "Заполните «Карточку клиента».");
  if (!N(c.amount) || !N(c.term)) add("nd", "Карточка", "Не указаны сумма или срок кредита", "Без суммы и срока нельзя посчитать будущий платёж и хватит ли на него денег.", "Укажите сумму, срок и ставку в «Карточке клиента».");
  if (!m.pl) add("nd", "Отчётность", "Нет данных о выручке и прибыли (ОПиУ)", "Без отчёта о прибылях и убытках нельзя понять, зарабатывает ли бизнес.", "Загрузите ОПиУ или внесите цифры вручную в «Финансовой отчётности».");
  if (!m.bal) add("nd", "Отчётность", "Нет баланса", "Без баланса не видно долгов, собственных средств и имущества компании.", "Загрузите баланс или внесите цифры вручную.");
  // стоп-факторы
  const overNow = (c.loans || []).filter(l => l.overdue === "now");
  if (overNow.length) add("crit", "Кредиты", "Текущая просрочка по действующим кредитам", `Клиент сейчас не платит вовремя: ${overNow.map(l => l.bank || "кредитор").join(", ")}. Это прямой признак нехватки денег.`, "Выяснить причину и сумму просрочки; до погашения просрочки заявку дальше не вести.");
  const overPast = (c.loans || []).filter(l => l.overdue === "past");
  if (overPast.length) add("chk", "Кредиты", "Были просрочки в прошлом", `По кредитам ${overPast.map(l => l.bank || "кредитор").join(", ")} были просрочки, сейчас погашены.`, "Посмотреть в кредитном отчёте ПКБ: сколько дней и как часто; запросить объяснение у клиента.");
  if (m.bal && isNum(m.eq) && m.eq < 0) add("crit", "Капитал", "Отрицательный собственный капитал", `Долгов у компании больше, чем всего имущества: капитал ${T(m.eq)}. Накопленные убытки «съели» собственные средства.`, "Обычно это стоп-фактор. Уточнить у риск-менеджера, возможно ли финансирование при докапитализации учредителем.");
  if (m.age !== null && m.age < NORM.age_min) add("risk", "Карточка", `Компания работает меньше ${NORM.age_min} месяцев`, `С даты регистрации прошло ${m.age} мес. Истории бизнеса почти нет, оценивать сложно.`, "Проверить требования программы к сроку деятельности; уточнить опыт учредителя в этом бизнесе.");
  // платёжеспособность
  if (isNum(m.dscr)) {
    if (m.dscr < NORM.dscr_min) add("crit", "Платёжеспособность", "Денег не хватает на платежи по кредитам", `Бизнес зарабатывает ~${T(m.cashMonth)} в месяц, а платить по всем кредитам (вместе с новым) нужно ~${T(m.payTotal)}. Покрытие ${fmt(m.dscr, "x")} — меньше 1.`, m.maxAmt > 0 ? `Снизить сумму до ~${T(Math.floor(m.maxAmt / 100) * 100)} или увеличить срок; проверить, нет ли неучтённых доходов (обороты по счетам).` : "При текущих доходах новый кредит не обслуживается. Проверить обороты по счетам и возможность рефинансирования.");
    else if (m.dscr < NORM.dscr_ok) add("chk", "Платёжеспособность", "Запас по платежам маленький", `Покрытие платежей ${fmt(m.dscr, "x")}: денег хватает впритык, нужно не меньше ${fmt(NORM.dscr_ok, "x")}.`, `Рассмотреть сумму до ~${T(Math.floor(m.maxAmt / 100) * 100)} или больший срок; подтвердить выручку выписками.`);
  } else if (m.pl && m.payTotal > 0 && m.cashMonth <= 0) add("crit", "Платёжеспособность", "Бизнес не зарабатывает денег на платежи", "Операционный результат отрицательный — платить по кредитам не из чего.", "Без подтверждённого источника погашения заявку не вести.");
  if (m.pl && !m.daKnown) add("nd", "Отчётность", "Не указана амортизация", "Без неё денежный поток считается по прибыли — это осторожная (заниженная) оценка.", "Если есть ДДС или пояснения к отчётности — внесите амортизацию в ОПиУ.");
  if (isNum(m.lev)) {
    if (m.lev > NORM.lev_max) add("risk", "Долговая нагрузка", "Слишком много долгов относительно заработка", `Все долги с новым кредитом (${T(m.debtNew)}) в ${fmt(m.lev, "1")} раза больше годового заработка (EBITDA ${T(m.ebitda)}). Норма — до ${fmt(NORM.lev_ok, "1")}.`, "Снизить сумму или рассмотреть рефинансирование действующих долгов.");
    else if (m.lev > NORM.lev_ok) add("chk", "Долговая нагрузка", "Долговая нагрузка повышенная", `Долги в ${fmt(m.lev, "1")} раза больше годового заработка (норма до ${fmt(NORM.lev_ok, "1")}).`, "Учесть в заключении; проверить, на что пойдёт кредит и даст ли он рост выручки.");
  } else if (m.pl && m.ebitda <= 0 && (m.debtNew > 0)) add("risk", "Долговая нагрузка", "Заработка нет, а долги есть", "Операционный результат отрицательный, поэтому долги обслуживать не из чего.", "Выяснить причины убытка и источник погашения.");
  // прибыль и выручка
  if (m.pl && m.ni < 0) add("risk", "Прибыль", "Компания работает в убыток", `Чистый убыток ${T(m.ni)} за ${perLabel(m.pl)}${m.k !== 1 ? " (в годовом выражении)" : ""}.`, "Узнать причину (разовые расходы, сезонность, рост затрат) и есть ли улучшение в текущем году.");
  if (isNum(m.revGr)) {
    if (m.revGr <= NORM.rev_drop_risk) add("risk", "Выручка", "Выручка сильно упала", `За ${perLabel(m.yr)} выручка снизилась на ${fmt(-m.revGr, "p")} к ${perLabel(m.yr0)}.`, "Узнать причину; запросить выручку за текущий год (выписки, декларации).");
    else if (m.revGr <= NORM.rev_drop_chk) add("chk", "Выручка", "Выручка снизилась", `Снижение на ${fmt(-m.revGr, "p")} к прошлому году.`, "Уточнить причину у клиента.");
  }
  if (isNum(m.ocf) && m.ocf < 0) add("risk", "Деньги", "Отрицательный денежный поток от основной деятельности", `По ДДС бизнес за год потратил на основную деятельность больше, чем получил: ${T(m.ocf)}. Прибыль «на бумаге» может не превращаться в деньги.`, "Проверить рост дебиторки и запасов; подтвердить поступления выписками.");
  // баланс
  if (isNum(m.liq)) {
    if (m.liq < NORM.liq_min) add("risk", "Ликвидность", "Текущих долгов намного больше, чем быстрых активов", `Коэффициент текущей ликвидности ${fmt(m.liq, "x")}: на 1 тенге долгов до года приходится ${fmt(m.liq, "x")} тенге денег, дебиторки и запасов.`, "Проверить, не придётся ли гасить краткосрочные долги за счёт нового кредита.");
    else if (m.liq < NORM.liq_ok) add("chk", "Ликвидность", "Ликвидность ниже нормы", `Коэффициент ${fmt(m.liq, "x")} (норма от ${fmt(NORM.liq_ok, "x")}).`, "Учесть в заключении.");
  }
  if (isNum(m.eqr) && N(m.eq) >= 0) {
    if (m.eqr < NORM.eq_min) add("risk", "Капитал", "Почти всё имущество куплено на заёмные деньги", `Собственный капитал — только ${fmt(m.eqr, "p")} от активов (норма от ${fmt(NORM.eq_ok, "p")}).`, "Уточнить возможность вложений учредителя.");
    else if (m.eqr < NORM.eq_ok) add("chk", "Капитал", "Мало собственного капитала", `Капитал ${fmt(m.eqr, "p")} от активов (норма от ${fmt(NORM.eq_ok, "p")}).`, "Учесть в заключении.");
  }
  // залог
  if (N(c.amount) && c.product !== "Овердрафт") {
    if (!(c.coll || []).length && !N(c.guarPct)) add("chk", "Залог", "Залог не указан", "Нет данных об обеспечении — покрытие посчитать нельзя.", "Внести залог в «Карточку клиента» или указать, что кредит беззалоговый по программе.");
    else if (m.coll < NORM.coll_min) add("risk", "Залог", "Залога сильно не хватает", `Залог (с дисконтом)${m.guarAmt ? " и гарантия фонда" : ""} покрывают ${fmt(m.coll, "p")} суммы кредита. Не хватает ~${T(N(c.amount) - m.collDisc - m.guarAmt)}.`, "Запросить дополнительный залог, гарантию фонда или снизить сумму.");
    else if (m.coll < NORM.coll_ok) add("chk", "Залог", "Залог покрывает не всю сумму", `Покрытие ${fmt(m.coll, "p")}. Не хватает ~${T(N(c.amount) - m.collDisc - m.guarAmt)}.`, "Добрать залог или гарантию; уточнить требования программы.");
  }
  // условия
  if (c.purpose === PURPOSES[0] && N(c.term) > NORM.wc_term) add("chk", "Условия", "Длинный срок для пополнения оборотки", `Срок ${c.term} мес.; для оборотных средств обычно не больше ${NORM.wc_term}.`, "Уточнить срок по программе.");
  if (m.pl && N(c.amount) && c.purpose === PURPOSES[0] && N(c.amount) > m.rev * NORM.wc_share) add("chk", "Условия", "Сумма велика для оборота компании", `Запрашивают ${T(c.amount)} — это ${fmt(N(c.amount) / m.rev, "p")} годовой выручки.`, "Попросить клиента обосновать потребность (контракты, план закупок).");
  if (c.sched === "end" && N(c.amount) && c.product === "Кредит") add("chk", "Условия", "Погашение долга одной суммой в конце", `В конце срока нужно будет вернуть сразу ${T(c.amount)}.`, "Понять, из каких денег будет погашение (контракт, сезон, рефинансирование).");

  /* --- расхождения (сверки) */
  const big = (a, b) => isNum(a) && isNum(b) && Math.abs(a - b) > NORM.diff_abs && Math.abs(a - b) > NORM.diff_pct * Math.max(Math.abs(a), Math.abs(b));
  for (const p of X.per) {
    const ta = val("ta", p.id), tle = val("tle", p.id), L = perLabel(p);
    if (isNum(ta) && isNum(tle) && Math.abs(ta - tle) > Math.max(5, 0.005 * ta)) add("chk", "Расхождения", `Баланс не сходится (${L})`, `Активы ${T(ta)}, а пассивы ${T(tle)} — разница ${T(ta - tle)}. Скорее всего, ошибка при вводе или загрузке.`, "Сверить строки с документом.");
    const tr = fv("ta_rep", p.id);
    if (isNum(ta) && isNum(tr) && Math.abs(ta - tr) > Math.max(5, 0.005 * tr)) add("chk", "Расхождения", `Итог активов не совпадает с отчётностью (${L})`, `По строкам ${T(ta)}, в документе ${T(tr)}.`, "Проверить, все ли строки баланса заполнены.");
    const ni = val("ni", p.id), nr = fv("ni_rep", p.id);
    if (isNum(ni) && isNum(nr) && Math.abs(ni - nr) > Math.max(5, 0.02 * Math.abs(nr))) add("chk", "Расхождения", `Чистая прибыль не совпадает с отчётностью (${L})`, `По строкам ${T(ni)}, в документе ${T(nr)}.`, "Проверить прочие доходы/расходы и налог.");
  }
  // долг по балансу и по карточке
  if (m.bal && (c.loans || []).length && big(m.debt, m.loanBal)) add("chk", "Расхождения", "Долги в балансе не совпадают с кредитами клиента", `В балансе кредитов ${T(m.debt)}, а по списку действующих кредитов ${T(m.loanBal)}.`, m.debt > m.loanBal ? "Возможно, есть займы, о которых клиент не сказал (от учредителя, других компаний). Запросить кредитный отчёт ПКБ и расшифровку займов." : "Возможно, кредиты взяты после отчётной даты или оформлены на учредителя. Уточнить у клиента.");
  if (m.bal && !(c.loans || []).length && m.debt > NORM.diff_abs) add("chk", "Расхождения", "В балансе есть кредиты, а в карточке их нет", `В балансе кредитов и займов на ${T(m.debt)}.`, "Заполнить «Взносы по действующим кредитам» — без них платёжеспособность завышена.");
  if (m.pl && m.debt > NORM.diff_abs && !m.int) add("chk", "Расхождения", "Есть кредиты, но нет расходов на проценты", "В балансе есть займы, а в ОПиУ проценты не отражены.", "Уточнить: беспроцентный заём учредителя или ошибка в отчётности.");
  // нераспределённая прибыль vs чистая прибыль
  if (m.yr && m.yr0) {
    const d = N(fv("re", m.yr.id)) - N(fv("re", m.yr0.id)), ni = val("ni", m.yr.id);
    if (isNum(fv("re", m.yr.id)) && isNum(fv("re", m.yr0.id)) && big(d, ni)) add("chk", "Расхождения", "Прибыль не «дошла» до капитала", `Чистая прибыль за ${perLabel(m.yr)} — ${T(ni)}, а нераспределённая прибыль изменилась на ${T(d)}.`, d < ni ? "Возможно, выплачены дивиденды — уточнить сумму (это деньги, ушедшие из бизнеса)." : "Возможны корректировки прошлых лет — уточнить у бухгалтера.");
    // дебиторка растёт быстрее выручки
    const a0 = fv("ar", m.yr0.id), a1 = fv("ar", m.yr.id);
    if (isNum(a0) && isNum(a1) && a0 > 0 && isNum(m.revGr) && a1 / a0 - 1 > m.revGr + 0.3) add("chk", "Расхождения", "Дебиторская задолженность растёт быстрее выручки", `Дебиторка выросла на ${fmt(a1 / a0 - 1, "p")}, а выручка — на ${fmt(m.revGr, "p")}. Покупатели стали дольше платить или часть продаж «на бумаге».`, "Запросить расшифровку дебиторки: крупные должники и сроки.");
  }
  // декларации vs ОПиУ
  for (const s of declYears()) {
    const p = X.per.find(pp => N(pp.months) === 12 && pp.date && pp.date.startsWith(String(s.year)) && isNum(fv("rev", pp.id)));
    if (!p) continue;
    const r = fv("rev", p.id);
    if (isNum(s.rev) && big(r, s.rev)) add("chk", "Расхождения", `Выручка в отчётности не совпадает с декларацией (${s.year})`, `В ОПиУ ${T(r)}, в декларации (${s.forms}) ${T(s.rev)} — разница ${fmt(Math.abs(r / s.rev - 1), "p")}.`, r > s.rev ? "Выручка в отчётности больше, чем показано налоговой — уточнить причину; верить меньшей цифре." : "В декларации доход больше — проверить, полная ли отчётность (может быть другая деятельность).");
    if (isNum(s.vat) && s.vat > 0 && r > s.vat * (1 + NORM.diff_pct) && r - s.vat > NORM.diff_abs) add("chk", "Расхождения", `Оборот по НДС меньше выручки (${s.year})`, `Оборот по декларациям НДС ${T(s.vat)}, выручка ${T(r)}.`, "Проверить, все ли кварталы 300.00 загружены.");
  }
  return out.sort((a, b) => SEVW[b.sev] - SEVW[a.sev]);
}
// декларации по годам (тыс. тг)
function declYears() {
  const by = {};
  for (const d of X.decl || []) {
    if (!d.year) continue;
    const y = by[d.year] = by[d.year] || { year: d.year, rev: null, vat: null, parts: {}, forms: new Set() };
    const v = d.vals || {};
    if (isNum(v.rev) && ["100", "110", "910", "220", "150", "913"].includes(d.form)) { const key = d.form + d.part; if (!y.parts[key]) { y.parts[key] = 1; y.rev = N(y.rev) + v.rev / 1000; y.forms.add(d.form + ".00"); } }
    if (d.form === "300" && (isNum(v.vat_turn) || isNum(v.vat_ex))) { y.vat = N(y.vat) + (N(v.vat_turn) + N(v.vat_ex)) / 1000; }
  }
  return Object.values(by).map(y => ({ ...y, forms: [...y.forms].join(", ") })).sort((a, b) => a.year - b.year);
}

/* ---------------------------------------------------------------- вердикт */
function verdict(probs) {
  const has = s => probs.some(p => p.sev === s), n = s => probs.filter(p => p.sev === s).length;
  const ess = probs.filter(p => p.sev === "nd" && /ОПиУ|баланса|сумма или срок/.test(p.title));
  if (ess.length) return { sev: "nd", icon: "?", title: "Недостаточно данных для вывода", text: "Заполните недостающее: " + ess.map(p => p.title.toLowerCase()).join("; ") + "." };
  if (has("crit")) return { sev: "crit", icon: "✕", title: "Предварительно не подходит", text: "Есть стоп-фактор(ы). Без их устранения заявку дальше не вести." };
  if (n("risk") >= 2) return { sev: "risk", icon: "!", title: "Сомнительно — нужна доработка", text: "Несколько серьёзных рисков. Возможна заявка на других условиях (меньше сумма, больше срок, дополнительный залог)." };
  if (has("risk")) return { sev: "chk", icon: "!", title: "Подходит с условиями", text: "Есть один серьёзный риск — его нужно закрыть до подачи заявки." };
  if (has("chk")) return { sev: "chk", icon: "✓", title: "Предварительно подходит, нужны уточнения", text: "Критичных проблем нет, но есть вопросы, которые надо прояснить с клиентом." };
  return { sev: "ok", icon: "✓", title: "Предварительно подходит", text: "Критичных проблем и расхождений не найдено. Можно собирать полный пакет документов." };
}

    ${coll.map((z, i) => `<tr><td class="c"><select class="inp" data-k="a.coll.${i}.type">${opts(Object.keys(COLL), z.type)}</select></td>
      <td class="c"><input class="inp txt" data-k="a.coll.${i}.desc" value="${esc(z.desc || "")}" placeholder="адрес, марка, площадь"></td>
      <td class="c"><input class="inp txt" data-k="a.coll.${i}.owner" value="${esc(z.owner || "")}" placeholder="сам клиент / ФИО"></td>
      <td class="c">${num(z.value, `a.coll.${i}.value`)}</td><td class="c">${num(z.disc, `a.coll.${i}.disc`)}</td>
      <td>${T(N(z.value) * (1 - N(z.disc) / 100))}</td><td class="x"><button class="xbtn" data-rm="coll.${i}">×</button></td></tr>`).join("")}
    ${coll.length ? `<tr class="tot"><td class="l" colspan="3">Итого</td><td>${T(m.collMkt)}</td><td></td><td>${T(m.collDisc)}</td><td></td></tr>` : `<tr><td colspan="7" class="l muted">Залог не добавлен.</td></tr>`}
    </tbody></table></div><div class="row" style="margin-top:10px"><button class="btn" data-add="coll">+ Залог</button>${N(c.amount) ? `<span class="small muted">Покрытие суммы займа: <b>${isNum(m.coll) ? fmt(m.coll, "p") : "—"}</b>${m.guarAmt ? ` (включая гарантию фонда ${fmt(m.guarAmt)} тыс. тг)` : ""}</span>` : ""}</div></section>
  <section class="panel"><h2>Гаранты</h2><p class="hint">Кто ещё отвечает по кредиту: учредитель, супруг(а), связанная компания.</p>
    <div class="tw"><table class="t"><thead><tr><th class="l">ФИО / наименование</th><th class="l">Тип</th><th class="l">Связь с клиентом</th><th class="l">Доход / имущество (кратко)</th><th></th></tr></thead><tbody>
    ${guar.map((g, i) => `<tr><td class="c"><input class="inp txt" data-k="a.guar.${i}.name" value="${esc(g.name || "")}"></td>
      <td class="c"><select class="inp" data-k="a.guar.${i}.type">${opts(["Физическое лицо", "Юридическое лицо"], g.type)}</select></td>
      <td class="c"><input class="inp txt" data-k="a.guar.${i}.rel" value="${esc(g.rel || "")}" placeholder="учредитель, супруг(а)…"></td>
      <td class="c"><input class="inp txt" data-k="a.guar.${i}.note" value="${esc(g.note || "")}"></td>
      <td class="x"><button class="xbtn" data-rm="guar.${i}">×</button></td></tr>`).join("") || `<tr><td colspan="5" class="l muted">Гарантов нет.</td></tr>`}
    </tbody></table></div><div class="row" style="margin-top:10px"><button class="btn" data-add="guar">+ Гарант</button></div></section>
  <section class="panel"><h2>Комментарий менеджера</h2><p class="hint">Всё важное со слов клиента: сезонность, крупные контракты, планы. Попадёт в заключение.</p>
    <textarea class="inp" data-k="c.notes" rows="4">${esc(c.notes || "")}</textarea></section>
  <div class="row noprint"><button class="btn primary" data-page="fin">Дальше: финансовая отчётность →</button></div>`;
}

/* ---------------------------------------------------------------- 2. Финансовая отчётность */
function pageFin() {
  if (!UPL.pid || perIdx(UPL.pid) < 0) UPL.pid = X.per[X.per.length - 1].id;
  const P = X.per, dy = declYears();
  const rows = blk => FL[blk].map(l => {
    if (l[0] === "sec") return `<tr class="sec"><td colspan="${P.length + 1}">${esc(l[1])}</td></tr>`;
    const d = LINEDEF[l[0]];
    const cells = P.map(p => d.typ === "calc" ? `<td>${T(val(d.key, p.id))}</td>` : `<td class="c">${num(fv(d.key, p.id), `f.${d.key}.${p.id}`)}</td>`).join("");
    return `<tr class="${d.typ === "calc" ? "tot" : ""}"><td class="l"${d.typ === "sub" ? ' style="padding-left:24px"' : ""}>${esc(d.label)}${d.hint ? `<span class="note">${esc(d.hint)}</span>` : ""}</td>${cells}</tr>`;
  }).join("");
  const head = `<thead><tr><th class="l" style="min-width:280px">Строка, тыс. тг</th>${P.map(p => `<th>${esc(perLabel(p))}</th>`).join("")}</tr></thead>`;
  return `<div class="pagehead"><div class="lead"><h1>Финансовая отчётность</h1><p>Загрузите баланс, ОПиУ и (если есть) ДДС в Excel или PDF — сайт сам найдёт нужные строки и разложит цифры по периодам. Можно и вручную: просто впишите суммы в таблицу. Налоговые декларации (100.00, 910.00, 300.00) загружаются туда же — сайт сверит их с выручкой.</p></div></div>
  <section class="panel"><h2>Периоды</h2><p class="hint">Обычно два последних года. Если есть отчётность за текущий год (например, 9 месяцев) — добавьте третий период: показатели будут пересчитаны в годовые.</p>
    <div class="tw"><table class="t" style="width:auto"><thead><tr><th class="l">Период</th><th class="l">Отчётная дата</th><th>Месяцев</th><th></th></tr></thead><tbody>
    ${P.map((p, i) => `<tr><td class="l"><b>${esc(perLabel(p))}</b></td><td class="c"><input class="inp txt" type="date" data-k="p.${i}.date" value="${esc(p.date || "")}"></td><td class="c" style="width:90px">${num(p.months, `p.${i}.months`)}</td><td class="x">${P.length > 1 ? `<button class="xbtn" data-rmper="${i}" title="Удалить период и его цифры">×</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div>${P.length < 3 ? `<div class="row" style="margin-top:10px"><button class="btn" data-act="addper">+ Период</button></div>` : ""}</section>
  <section class="panel noprint"><h2>Загрузить документы</h2>
    <div class="row" style="margin-bottom:10px">${fld("В какой период загружать", `<select class="inp" data-upl="pid">${opts(P.map(p => [p.id, perLabel(p)]), UPL.pid)}</select>`)}${fld("Единицы в файле", `<select class="inp" data-upl="units">${opts([["auto", "определить сами"], ["t", "тенге"], ["k", "тыс. тенге"], ["m", "млн тенге"]], UPL.units)}</select>`)}</div>
    <div class="drop" id="drop"><b>Перетащите файлы сюда</b>или <button class="btn" data-act="pick">выберите на компьютере</button><div class="small muted" style="margin-top:6px">Excel (.xlsx, .xls) или PDF с текстом (не скан). Если в форме есть колонка за прошлый год — она попадёт в предыдущий период.</div></div>
    ${UPL.log.length ? `<div class="flist">${UPL.log.map(r => `<div class="fitem ${r.ok ? "ok" : "err"}"><span class="ic">${r.ok ? "✓" : "!"}</span><div class="fn"><b>${esc(r.file)}</b><br>${esc(r.txt || r.err)}</div></div>`).join("")}</div><p class="small muted" style="margin-top:8px">Проверьте цифры в таблице ниже — особенно итоги: «Итого активы» должны совпасть с документом.</p>` : ""}
  </section>
  <section class="panel"><h2>Баланс</h2><div class="tw"><table class="t">${head}<tbody>${rows("bal")}</tbody></table></div></section>
  <section class="panel"><h2>Отчёт о прибылях и убытках (ОПиУ)</h2><p class="hint">Расходы — положительными числами. Для неполного года — цифры с начала года (как в отчётности).</p><div class="tw"><table class="t">${head}<tbody>${rows("pl")}</tbody></table></div></section>
  <section class="panel"><h2>Движение денежных средств (ДДС)</h2><p class="hint">Необязательно. Если ДДС нет — пропустите.</p><div class="tw"><table class="t">${head}<tbody>${rows("cf")}</tbody></table></div></section>
  <section class="panel"><h2>Налоговые декларации</h2><p class="hint">Загружаются в окно выше. Или внесите доход вручную. Суммы — в тыс. тг.</p>
    <div class="tw"><table class="t"><thead><tr><th class="l">Форма</th><th class="l">Год</th><th class="l">Период</th><th>Доход</th><th>Оборот по НДС</th><th class="l">Файл</th><th></th></tr></thead><tbody>
    ${(X.decl || []).slice().sort((a, b) => (a.year - b.year) || String(a.form).localeCompare(b.form) || String(a.part).localeCompare(b.part)).map(d => { const i = X.decl.indexOf(d); return `<tr><td class="c"><select class="inp" data-k="d.${i}.form">${opts([["100", "100.00 КПН"], ["910", "910.00 упрощённая"], ["300", "300.00 НДС"], ["200", "200.00 ИПН/СН"], ["220", "220.00 ИПН"]].concat(["100", "910", "300", "200", "220"].includes(d.form) ? [] : [[d.form, d.formName || d.form]]), d.form)}</select></td>
      <td class="c" style="width:90px">${num(d.year, `d.${i}.year`)}</td>
      <td class="c"><select class="inp" data-k="d.${i}.part">${opts(Object.entries(PART_TXT), d.part)}</select></td>
      <td class="c">${num(isNum(d.vals?.rev) ? d.vals.rev / 1000 : null, `d.${i}.rev`)}</td>
      <td class="c">${num(isNum(d.vals?.vat_turn) ? d.vals.vat_turn / 1000 : null, `d.${i}.vat_turn`)}</td>
      <td class="l small muted">${esc(d.file || "вручную")}</td><td class="x"><button class="xbtn" data-rmdecl="${i}">×</button></td></tr>`; }).join("") || `<tr><td colspan="7" class="l muted">Деклараций нет.</td></tr>`}
    </tbody></table></div><div class="row" style="margin-top:10px"><button class="btn" data-act="adddecl">+ Декларация вручную</button></div>
    ${dy.length ? `<p class="small" style="margin-top:10px">Итого по годам: ${dy.map(y => `<b>${y.year}</b> — доход ${isNum(y.rev) ? fmt(y.rev) : "—"}${isNum(y.vat) ? `, оборот НДС ${fmt(y.vat)}` : ""}`).join("; ")} тыс. тг.</p>` : ""}
  </section>
  ${X.files.length ? `<p class="small muted">Загружено файлов: ${X.files.length}. Последние: ${X.files.slice(0, 5).map(f => esc(f.name)).join(", ")}.</p>` : ""}
  <div class="row noprint"><button class="btn primary" data-page="an">Дальше: анализ →</button></div>`;
}

/* ---------------------------------------------------------------- 3. Анализ */
function kpi(sev, title, value, unit, explain, note, hint) {
  return `<div class="kpi ${sev}"><div class="k"><span>${esc(title)} ${hint ? tip(hint) : ""}</span><span class="tag ${sev}">${SEVT[sev]}</span></div><div class="v">${value}${unit ? ` <small>${unit}</small>` : ""}</div><div class="e">${explain}</div>${note ? `<div class="n">${note}</div>` : ""}</div>`;
}
function sevBy(v, ok, min, higherBetter = true) { if (!isNum(v)) return "nd"; return higherBetter ? (v >= ok ? "ok" : v >= min ? "chk" : "risk") : (v <= ok ? "ok" : v <= min ? "chk" : "risk"); }
function pageAn(pr, v) {
  const m = analyze(), c = X.card;
  if (!m.pl && !m.bal) return `<div class="pagehead"><div class="lead"><h1>Анализ</h1></div></div><div class="verdict nd"><div class="vicon">?</div><div><div class="big">Нет финансовых данных</div><p>Загрузите или внесите баланс и ОПиУ на странице «Финансовая отчётность».</p></div></div><button class="btn primary" data-page="fin">Перейти к отчётности</button>`;
  const ann = m.k !== 1 ? ` (${perLabel(m.pl)} → в годовом выражении)` : "";
  const dscrSev = !isNum(m.dscr) ? "nd" : m.dscr >= NORM.dscr_ok ? "ok" : m.dscr >= NORM.dscr_min ? "chk" : "crit";
  const k = [
    kpi(m.rev > 0 ? (isNum(m.revGr) ? sevBy(m.revGr, NORM.rev_drop_chk, NORM.rev_drop_risk) : "ok") : "nd", "Выручка за год", T(m.rev), "тыс. тг", `Сколько компания продаёт за год${ann}.`, isNum(m.revGr) ? `Изменение к прошлому году: <b>${m.revGr >= 0 ? "+" : ""}${fmt(m.revGr, "p")}</b>` : "Динамику посчитать нельзя — нужен ещё один полный год."),
    kpi(!m.pl ? "nd" : m.ni > 0 ? "ok" : "risk", "Чистая прибыль", T(m.ni), "тыс. тг", m.ni > 0 ? `Компания зарабатывает: из каждых 100 тенге выручки остаётся ${fmt(m.nm * 100, "1")} тенге прибыли.` : "Компания работает в убыток.", isNum(m.gm) ? `Наценка (валовая маржа): ${fmt(m.gm, "p")}` : ""),
    kpi(dscrSev, "Хватает ли денег на платежи", isNum(m.dscr) ? fmt(m.dscr, "x") : "—", "", isNum(m.dscr) ? `Бизнес зарабатывает ~${T(m.cashMonth)} тыс. тг в месяц, а платить по всем кредитам нужно ~${T(m.payTotal)}. Нужно не меньше ${fmt(NORM.dscr_ok, "x")}: т.е. на каждый тенге платежа — ${fmt(NORM.dscr_ok, "x")} тенге дохода.` : "Нет данных о платежах или о прибыли.", m.daKnown ? "" : "Амортизация не указана — оценка осторожная.", "DSCR = (EBITDA − КПН) / 12 ÷ платежи по всем кредитам в месяц"),
    kpi(sevBy(m.lev, NORM.lev_ok, NORM.lev_max, false), "Долговая нагрузка", isNum(m.lev) ? fmt(m.lev, "1") : "—", "лет", isNum(m.lev) ? `За сколько лет компания могла бы погасить все долги (с новым кредитом — ${T(m.debtNew)} тыс. тг), если бы весь заработок шёл на это. Норма — до ${fmt(NORM.lev_ok, "1")}.` : "Нет данных о долгах или EBITDA.", "", "Долг / EBITDA. EBITDA — прибыль до процентов, налогов и амортизации"),
    kpi(c.product === "Овердрафт" ? "nd" : sevBy(m.coll, NORM.coll_ok, NORM.coll_min), "Покрытие залогом", isNum(m.coll) ? fmt(m.coll, "p") : "—", "", isNum(m.coll) ? `Залог с учётом дисконта${m.guarAmt ? " и гарантии фонда" : ""} покрывает эту долю суммы займа. Норма — от 100 %.` : "Нет суммы займа или залога.", m.collDisc ? `Залоговая стоимость: ${T(m.collDisc)} тыс. тг` : ""),
    kpi(sevBy(m.liq, NORM.liq_ok, NORM.liq_min), "Ликвидность", isNum(m.liq) ? fmt(m.liq, "x") : "—", "", "Хватает ли денег, дебиторки и запасов, чтобы закрыть долги до года. Норма — от 1.", "", "Текущие активы / текущие обязательства"),
    kpi(!isNum(m.eqr) ? "nd" : N(m.eq) < 0 ? "crit" : sevBy(m.eqr, NORM.eq_ok, NORM.eq_min), "Собственные средства", isNum(m.eqr) ? fmt(m.eqr, "p") : "—", "", "Какая часть имущества компании принадлежит ей самой, а не куплена в долг. Норма — от 20 %.", isNum(m.eq) ? `Капитал: ${T(m.eq)} тыс. тг` : ""),
  ];
  const keyRows = [["Выручка", p => fv("rev", p.id)], ["Чистая прибыль", p => val("ni", p.id)], ["EBITDA (заработок до процентов и налогов)", p => val("ebitda", p.id)], ["Активы", p => val("ta", p.id)], ["Собственный капитал", p => fv("eq", p.id)], ["Кредиты и займы", p => val("debt", p.id)], ["Дебиторская задолженность", p => fv("ar", p.id)], ["Запасы", p => fv("inv", p.id)]];
  return `<div class="pagehead"><div class="lead"><h1>Анализ</h1><p>Короткая картина: самое главное о бизнесе клиента. Цвет плашки: зелёный — норма, жёлтый — проверить, красный — риск.</p></div></div>
  <div class="verdict ${v.sev}"><div class="vicon">${v.icon}</div><div><div class="big">${esc(v.title)}</div><p>${esc(v.text)}</p></div></div>
  <div class="kpis">${k.join("")}</div>
  <section class="panel"><h2>Сколько можно дать</h2><p class="hint">Расчёт по текущему заработку бизнеса и платежам по действующим кредитам, с запасом ${Math.round((NORM.dscr_ok - 1) * 100)} % на непредвиденное — при тех же сроке, ставке и способе погашения.</p>
    <div class="maxsum">
      <div><span class="small muted">Запрашивают</span><div class="v">${T(c.amount)} <small class="muted">тыс. тг</small></div><span class="small">платёж ~${m.newPay ? fmt(m.newPay.pay) : "—"} в месяц</span></div>
      <div><span class="small muted">Свободно для нового платежа</span><div class="v">${isNum(m.payFree) ? T(Math.max(0, m.payFree)) : "—"} <small class="muted">тыс. тг / мес.</small></div><span class="small">заработок ${T(m.cashMonth)} − платежи ${T(m.payExist)}, с запасом</span></div>
      <div><span class="small muted">Максимальная сумма по доходам</span><div class="v">${isNum(m.maxAmt) ? T(Math.floor(m.maxAmt / 100) * 100) : "—"} <small class="muted">тыс. тг</small></div><span class="small">${isNum(m.maxAmt) && N(c.amount) ? (m.maxAmt >= N(c.amount) ? "запрос укладывается" : "запрос больше — " + (m.maxAmt > 0 ? "снизить сумму или увеличить срок" : "доходов не хватает")) : ""}</span></div>
    </div></section>
  <section class="panel"><h2>Ключевые цифры</h2><p class="hint">Тыс. тг, как в отчётности (неполный год — с начала года, без пересчёта).</p>
    <div class="tw"><table class="t"><thead><tr><th class="l">Показатель</th>${X.per.map(p => `<th>${esc(perLabel(p))}</th>`).join("")}</tr></thead><tbody>
    ${keyRows.map(([t, f]) => `<tr><td class="l">${t}</td>${X.per.map(p => { const x = f(p); return `<td class="${isNum(x) && x < 0 ? "neg" : ""}">${T(x)}</td>`; }).join("")}</tr>`).join("")}
    </tbody></table></div></section>
  <section class="panel"><h2>Платежи в месяц</h2>
    <div class="tw"><table class="t" style="max-width:640px"><tbody>
      <tr><td class="l">Заработок бизнеса в месяц (EBITDA − КПН) / 12</td><td>${T(m.cashMonth)}</td></tr>
      ${(c.loans || []).map(l => `<tr><td class="l">— ${esc(l.bank || "кредитор")} (${esc(l.kind || "")})${l.refin ? " — рефинансируется, не учитывается" : ""}</td><td>${l.refin ? "<s>" + T(l.pay) + "</s>" : T(l.pay)}</td></tr>`).join("")}
      <tr><td class="l">— новый кредит</td><td>${m.newPay ? T(m.newPay.pay) : "—"}</td></tr>
      <tr class="tot"><td class="l">Все платежи</td><td>${T(m.payTotal)}</td></tr>
      <tr class="tot"><td class="l">Остаётся после платежей</td><td class="${m.cashMonth - m.payTotal < 0 ? "neg" : ""}">${isNum(m.cashMonth) ? T(m.cashMonth - m.payTotal) : "—"}</td></tr>
    </tbody></table></div>${isNum(m.ocf) ? `<p class="small muted" style="margin-top:8px">По ДДС поток от основной деятельности — ${T(m.ocf)} тыс. тг в год (${T(m.ocf / 12)} в месяц).</p>` : ""}</section>
  <div class="row noprint"><button class="btn primary" data-page="prob">Дальше: проблемы →</button></div>`;
}

/* ---------------------------------------------------------------- 4. Проблемы */
function pageProb(pr) {
  const cnt = s => pr.filter(p => p.sev === s).length;
  const groups = [["crit", "Стоп-факторы"], ["risk", "Риски"], ["chk", "Проверить и уточнить"], ["nd", "Не хватает данных"]];
  return `<div class="pagehead"><div class="lead"><h1>Проблемы и расхождения</h1><p>Что сайт нашёл в данных клиента. У каждой проблемы — объяснение простым языком и что сделать. Расхождения — это когда цифры из разных источников не совпадают (баланс и список кредитов, отчётность и декларация).</p></div></div>
  <div class="cnt">${groups.map(([s, t]) => `<span class="tag ${s}">${t}: ${cnt(s)}</span>`).join("")}</div>
  ${pr.length ? groups.map(([s, t]) => { const L = pr.filter(p => p.sev === s); return L.length ? `<h2 style="margin:18px 0 10px">${t}</h2>` + L.map(p => `<div class="prob ${p.sev}"><div class="hd"><span class="tag ${p.sev}">${SEVT[p.sev]}</span><b>${esc(p.title)}</b><span class="area">${esc(p.area)}</span></div><p class="why">${esc(p.why)}</p>${p.todo ? `<div class="todo">${esc(p.todo)}</div>` : ""}</div>`).join("") : ""; }).join("")
    : `<div class="verdict ok"><div class="vicon">✓</div><div><div class="big">Проблем не найдено</div><p>По введённым данным критичных моментов и расхождений нет.</p></div></div>`}
  <div class="row noprint" style="margin-top:14px"><button class="btn primary" data-page="concl">Дальше: заключение →</button></div>`;
}

/* ---------------------------------------------------------------- 5. Заключение */
function pageConcl(pr, v) {
  X.concl = X.concl || { text: "", edited: false };
  if (!X.concl.text) X.concl.text = buildConclusion(pr, v);
  return `<div class="pagehead"><div class="lead"><h1>Заключение</h1><p>Сайт написал заключение сам по всем данным. Текст можно править — правки сохраняются. «Сформировать заново» вернёт автоматический текст.</p></div>
    <div class="row noprint"><button class="btn" data-act="regen">Сформировать заново</button><button class="btn" data-act="copy">Копировать текст</button><button class="btn primary" data-act="print">Печать / PDF</button></div></div>
  <div class="verdict ${v.sev}"><div class="vicon">${v.icon}</div><div><div class="big">${esc(v.title)}</div><p>${esc(v.text)}</p></div></div>
  ${X.concl.edited ? `<p class="edited noprint">Текст изменён вручную — автоматически не обновляется.</p>` : ""}
  <textarea class="concl" id="concl" data-k="concl" spellcheck="true">${esc(X.concl.text)}</textarea>
  <div class="printonly">${esc(X.concl.text)}</div>`;
}
function buildConclusion(pr, v) {
  const c = X.card, m = analyze(), L = [], t = x => isNum(x) ? fmt(x) + " тыс. тг" : "нет данных";
  const today = new Date().toLocaleDateString("ru-RU");
  L.push(`ЭКСПРЕСС-АНАЛИЗ КЛИЕНТА (предварительная оценка)`);
  L.push(`Дата: ${today}${c.km ? `. Кредитный менеджер: ${c.km}` : ""}`);
  L.push("");
  L.push(`ВЫВОД: ${v.title.toUpperCase()}`);
  L.push(v.text);
  L.push("");
  L.push("1. КЛИЕНТ И ЗАПРОС");
  L.push(`${c.name || "Клиент"}${c.bin ? `, БИН/ИИН ${c.bin}` : ""}${c.regDate ? `, зарегистрирован ${new Date(c.regDate).toLocaleDateString("ru-RU")}${isNum(m.age) ? ` (работает ${m.age >= 24 ? Math.floor(m.age / 12) + " лет" : m.age + " мес."})` : ""}` : ""}.`);
  if (c.activity) L.push(`Деятельность: ${c.activity}.`);
  if (c.director || c.owners) L.push([c.director ? `Руководитель: ${c.director}` : "", c.owners ? `учредители: ${c.owners}` : ""].filter(Boolean).join("; ") + ".");
  L.push(`Запрос: ${(c.product || "кредит").toLowerCase()} на сумму ${t(c.amount)}, срок ${c.term || "—"} мес., ставка ${isNum(c.rate) ? fmt(c.rate, "1") + " %" : "—"}, цель — ${(c.purpose || "").toLowerCase()}. Программа: ${c.program || "не указана"}.`);
  if (m.newPay) L.push(`Ежемесячный платёж по новому кредиту — около ${t(m.newPay.pay)} (${m.newPay.note}).`);
  L.push("");
  L.push("2. ФИНАНСОВОЕ ПОЛОЖЕНИЕ");
  if (m.pl) {
    L.push(`Выручка за ${perLabel(m.pl)} — ${t(fv("rev", m.pl.id))}${m.k !== 1 ? ` (в пересчёте на год ~${t(m.rev)})` : ""}${isNum(m.revGr) ? `; ${m.yr === m.pl ? "" : `за ${perLabel(m.yr)} `}${m.revGr >= 0 ? "рост" : "снижение"} на ${fmt(Math.abs(m.revGr), "p")} к прошлому году` : ""}.`);
    L.push(m.ni >= 0 ? `Бизнес прибыльный: чистая прибыль ${t(val("ni", m.pl.id))}, из каждых 100 тенге выручки остаётся ${fmt(m.nm * 100, "1")} тенге.` : `Бизнес убыточный: чистый убыток ${t(val("ni", m.pl.id))}.`);
    L.push(`Заработок до процентов, налогов и амортизации (EBITDA) — ${t(m.ebitda)} в год${m.daKnown ? "" : " (без амортизации — оценка осторожная)"}.`);
  } else L.push("Данных о выручке и прибыли нет.");
  if (m.bal) {
    L.push(`На ${new Date(m.bal.date).toLocaleDateString("ru-RU")}: активы ${t(m.ta)}, собственный капитал ${t(m.eq)} (${isNum(m.eqr) ? fmt(m.eqr, "p") : "—"} от активов), кредиты и займы ${t(m.debt)}.`);
    if (isNum(m.liq)) L.push(`Ликвидность ${fmt(m.liq, "x")} — ${m.liq >= NORM.liq_ok ? "текущих активов хватает на погашение долгов до года" : "текущих активов не хватает на погашение долгов до года"}.`);
  }
  if (isNum(m.ocf)) L.push(`По ДДС поток от основной деятельности — ${t(m.ocf)} в год.`);
  L.push("");
  L.push("3. ПЛАТЁЖЕСПОСОБНОСТЬ");
  const loans = c.loans || [];
  L.push(loans.length ? `Действующие кредиты: ${loans.length}, общий остаток ${t(m.loanBal)}, платежи ${t(m.payExist)} в месяц${m.refinBal ? ` (без рефинансируемых на ${t(m.refinBal)})` : ""}.` : "Действующих кредитов по данным клиента нет.");
  if (loans.some(l => l.overdue && l.overdue !== "no")) L.push(`Просрочки: ${loans.filter(l => l.overdue && l.overdue !== "no").map(l => `${l.bank || "кредитор"} — ${OVERDUE[l.overdue]}`).join("; ")}.`);
  if (isNum(m.dscr)) {
    L.push(`Бизнес зарабатывает около ${t(m.cashMonth)} в месяц; со всеми платежами, включая новый кредит, нужно платить ${t(m.payTotal)} в месяц. Покрытие платежей ${fmt(m.dscr, "x")} (норма от ${fmt(NORM.dscr_ok, "x")}) — ${m.dscr >= NORM.dscr_ok ? "денег хватает с запасом" : m.dscr >= 1 ? "денег хватает впритык" : "денег не хватает"}.`);
    if (isNum(m.maxAmt) && N(c.amount)) L.push(m.maxAmt >= N(c.amount) ? `Запрошенная сумма укладывается в возможности клиента (по доходам — до ~${t(Math.floor(m.maxAmt / 100) * 100)}).` : m.maxAmt > 0 ? `По доходам клиент может обслуживать кредит примерно до ${t(Math.floor(m.maxAmt / 100) * 100)} на тех же условиях — это меньше запрошенного.` : "При текущих доходах новый кредит клиенту не по силам.");
  }
  if (isNum(m.lev)) L.push(`Все долги с новым кредитом — ${t(m.debtNew)}, это ${fmt(m.lev, "1")} годового заработка (норма до ${fmt(NORM.lev_ok, "1")}).`);
  L.push("");
  L.push("4. ОБЕСПЕЧЕНИЕ");
  const coll = c.coll || [];
  if (coll.length) {
    coll.forEach(z => L.push(`– ${z.type}${z.desc ? ": " + z.desc : ""}${z.owner ? `, залогодатель — ${z.owner}` : ""}; рыночная ${t(z.value)}, залоговая ${t(N(z.value) * (1 - N(z.disc) / 100))} (дисконт ${fmt(N(z.disc), "m")} %).`));
  } else L.push("Залог не указан.");
  if (m.guarAmt) L.push(`Гарантия фонда ${fmt(N(c.guarPct), "m")} % — ${t(m.guarAmt)}.`);
  if (isNum(m.coll)) L.push(`Покрытие суммы займа — ${fmt(m.coll, "p")}${m.coll >= NORM.coll_ok ? ", достаточно" : ", недостаточно"}.`);
  const g = c.guar || [];
  if (g.length) L.push(`Гаранты: ${g.map(x => `${x.name || "—"}${x.rel ? ` (${x.rel})` : ""}`).join("; ")}.`);
  L.push("");
  L.push("5. ПРОБЛЕМЫ И РАСХОЖДЕНИЯ");
  const serious = pr.filter(p => p.sev !== "ok");
  if (serious.length) serious.forEach((p, i) => L.push(`${i + 1}) [${SEVT[p.sev]}] ${p.title}. ${p.why}`));
  else L.push("Существенных проблем и расхождений не выявлено.");
  L.push("");
  L.push("6. РЕКОМЕНДАЦИЯ И ДАЛЬНЕЙШИЕ ДЕЙСТВИЯ");
  if (v.sev === "crit") L.push("Заявку дальше не вести до устранения стоп-факторов. Сообщить клиенту о причинах.");
  else if (v.sev === "nd") L.push("Дособрать данные и повторить экспресс-анализ.");
  else if (v.sev === "ok") L.push("Клиент предварительно соответствует требованиям. Запросить полный пакет документов и передать на анализ.");
  else L.push(`Клиента можно рассматривать при условии: ${[isNum(m.maxAmt) && N(c.amount) > m.maxAmt && m.maxAmt > 0 ? `снижение суммы до ~${t(Math.floor(m.maxAmt / 100) * 100)} или увеличение срока` : "", isNum(m.coll) && m.coll < NORM.coll_ok ? "дополнительный залог или гарантия фонда" : ""].filter(Boolean).join("; ") || "закрытие вопросов ниже"}.`);
  const todos = [...new Set(pr.filter(p => p.todo && p.sev !== "ok").map(p => p.todo))];
  if (todos.length) { L.push("Что запросить / уточнить у клиента:"); todos.forEach(x => L.push("– " + x)); }
  if (c.notes) { L.push(""); L.push("КОММЕНТАРИЙ МЕНЕДЖЕРА"); L.push(c.notes); }
  L.push("");
  L.push("Экспресс-анализ предварительный и не заменяет полного анализа и решения кредитного комитета. Суммы — в тыс. тенге.");
  return L.join("\n");
}


/* ================================================================ Экспресс-анализ: события, пример, запуск */
const NUMF = new Set(["amount", "term", "rate", "grace", "guarPct", "balance", "pay", "value", "disc", "months", "year", "rev", "vat_turn"]);
// подтверждение внутри страницы (системные окна в некоторых браузерах и превью заблокированы)
function ask(msg, yes = "Да", no = "Отмена") {
  return new Promise(res => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>Подтвердите</h3><p>${esc(msg)}</p><div class="row"><button class="btn" data-q="0">${esc(no)}</button><button class="btn primary" data-q="1">${esc(yes)}</button></div></div>`;
    m.addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (!b && e.target !== m) return; e.stopPropagation(); m.remove(); res(!!(b && b.dataset.q === "1")); });
    document.body.appendChild(m); m.querySelector('[data-q="1"]').focus();
  });
}
function openClient(c, page = "card") { X = c; PAGE = page; UPL = { pid: null, units: "auto", log: [] }; renderClient(); window.scrollTo(0, 0); }

function onChange(el) {
  const k = el.dataset.k; if (!k) return false;
  const parts = k.split("."), raw = el.type === "checkbox" ? el.checked : el.value;
  const nval = () => { const v = parseNum(raw); return v; };
  if (parts[0] === "c") { const f = parts[1]; X.card[f] = NUMF.has(f) ? nval() : raw; }
  else if (parts[0] === "a") {
    const [, arr, i, f] = parts, o = X.card[arr][+i];
    if (f === "refin") o.refin = !!raw;
    else o[f] = NUMF.has(f) ? nval() : raw;
    if (arr === "coll" && f === "type") o.disc = COLL[raw] ?? o.disc;
  }
  else if (parts[0] === "f") { setFv(parts[1], parts[2], nval()); }
  else if (parts[0] === "p") { const p = X.per[+parts[1]]; if (parts[2] === "months") { const v = nval(); p.months = isNum(v) && v >= 1 && v <= 12 ? Math.round(v) : 12; } else p.date = raw; }
  else if (parts[0] === "d") {
    const d = X.decl[+parts[1]], f = parts[2];
    if (f === "rev" || f === "vat_turn") { const v = nval(); d.vals = d.vals || {}; if (isNum(v)) d.vals[f] = v * 1000; else delete d.vals[f]; }
    else if (f === "year") d.year = nval();
    else { d[f] = raw; if (f === "form") d.formName = { "100": "КПН (ф. 100.00)", "910": "Упрощённая декларация (ф. 910.00)", "300": "НДС (ф. 300.00)", "200": "ИПН и социальный налог (ф. 200.00)", "220": "ИПН (ф. 220.00)" }[raw] || raw; }
  }
  else if (k === "concl") { return true; }
  touch(); return true;
}
async function handleFiles(files) {
  if (!files || !files.length) return;
  const pid = UPL.pid || X.per[X.per.length - 1].id;
  toast("Читаю файлы…");
  for (const f of files) {
    let rep;
    try { rep = await importFile(f, pid, UPL.units); } catch (e) { rep = [{ err: "ошибка разбора: " + e.message }]; }
    for (const r of rep) UPL.log.unshift({ file: f.name, ...r });
  }
  UPL.log = UPL.log.slice(0, 12);
  touch(); saveAll(true); rerender();
  toast("Готово — проверьте цифры в таблицах");
}

document.addEventListener("click", async e => {
  if (e.target.closest(".modal")) return;
  const t = e.target.closest("button, [data-open], .citem"); if (!t) return;
  const d = t.dataset;
  if (d.del) { e.stopPropagation(); const c = CLIENTS.find(x => x.id === d.del); if (c && await ask(`Удалить клиента «${c.card.name || "без названия"}»? Это нельзя отменить.`, "Удалить")) { CLIENTS = CLIENTS.filter(x => x.id !== d.del); saveAll(true); renderHome(); } return; }
  if (d.open) { const c = CLIENTS.find(x => x.id === d.open); if (c) openClient(c, c.demo ? "an" : "card"); return; }
  if (d.page) { PAGE = d.page; renderClient(); window.scrollTo(0, 0); return; }
  if (d.add) { const arr = X.card[d.add] = X.card[d.add] || []; arr.push(d.add === "loans" ? { bank: "", kind: "Кредит", balance: null, pay: null, end: "", overdue: "no", refin: false } : d.add === "coll" ? { type: "Недвижимость коммерческая", desc: "", owner: "", value: null, disc: COLL["Недвижимость коммерческая"] } : { name: "", type: "Физическое лицо", rel: "", note: "" }); touch(); rerender(); return; }
  if (d.rm) { const [arr, i] = d.rm.split("."); X.card[arr].splice(+i, 1); touch(); rerender(); return; }
  if (d.rmper !== undefined) { const i = +d.rmper, p = X.per[i]; if (!(await ask(`Удалить период «${perLabel(p)}» и все его цифры?`, "Удалить"))) return; for (const k of Object.keys(X.fin)) delete X.fin[k][p.id]; X.per.splice(i, 1); touch(); rerender(); return; }
  if (d.rmdecl !== undefined) { X.decl.splice(+d.rmdecl, 1); touch(); rerender(); return; }
  switch (d.act) {
    case "new": { const c = newClient(); CLIENTS.push(c); saveAll(true); openClient(c); break; }
    case "demo": { let c = CLIENTS.find(x => x.demo); if (!c) { c = demoClient(); CLIENTS.push(c); saveAll(true); } openClient(c, "card"); toast("Это вымышленная компания — можно менять цифры и смотреть, как меняется вывод"); break; }
    case "openfile": $("#ofile").click(); break;
    case "home": saveAll(true); renderHome(); window.scrollTo(0, 0); break;
    case "save": download(`Экспресс_${(X.card.name || "клиент").replace(/[^\wА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі -]+/g, "").trim() || "клиент"}_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: "finkz-express", v: 1, client: X }, null, 1)); toast("Файл сохранён в «Загрузки»"); break;
    case "addper": { const last = X.per[X.per.length - 1], y = last && last.date ? +last.date.slice(0, 4) + 1 : new Date().getFullYear(); X.per.push({ id: uid(), date: `${y}-${N(last?.months) === 12 ? "09-30" : "12-31"}`, months: N(last?.months) === 12 ? 9 : 12 }); touch(); rerender(); break; }
    case "pick": $("#ufile").click(); break;
    case "adddecl": X.decl.push({ id: uid(), file: "", form: "100", formName: "КПН (ф. 100.00)", year: new Date().getFullYear() - 1, part: "Y", vals: {} }); touch(); rerender(); break;
    case "regen": if (!X.concl.edited || await ask("Заменить ваш текст автоматическим?", "Заменить")) { X.concl = { text: "", edited: false }; saveAll(); rerender(); } break;
    case "copy": try { await navigator.clipboard.writeText(X.concl.text); toast("Текст скопирован"); } catch (err) { $("#concl").select(); document.execCommand("copy"); toast("Текст скопирован"); } break;
    case "print": window.print(); break;
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "ofile") { const f = el.files[0]; if (!f) return; f.text().then(txt => { try { const o = JSON.parse(txt), c = o.client || o; if (!c.card || !c.per) throw new Error(); c.id = uid(); c.demo = false; CLIENTS.push(c); saveAll(true); openClient(c); toast("Клиент открыт из файла"); } catch (err) { toast("Это не файл экспресс-анализа"); } }); return; }
  if (el.id === "ufile") { handleFiles([...el.files]); el.value = ""; return; }
  if (el.dataset.upl) { UPL[el.dataset.upl] = el.value; return; }
  if (el.dataset.k === "concl") return;
  if (onChange(el)) { PENDING = true; if (!PD) setTimeout(flush, 0); }
});
function flush() { if (PENDING && X && !PD) { PENDING = false; rerender(); } }
// если поле теряет фокус из-за нажатия кнопки — перерисовываем после клика, чтобы клик не потерялся
let PD = false, PENDING = false;
document.addEventListener("pointerdown", () => { PD = true; }, true);
document.addEventListener("pointerup", () => { PD = false; setTimeout(flush, 0); }, true);
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.k === "concl") { X.concl.text = el.value; X.concl.edited = true; saveAll(); const p = $(".printonly"); if (p) p.textContent = el.value; }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input.inp")) e.target.blur(); });
document.addEventListener("focusin", e => { if (e.target.matches("input.num")) { const v = parseNum(e.target.value); if (isNum(v)) e.target.value = String(v).replace(".", ","); e.target.select(); } });
document.addEventListener("dragover", e => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.add("on"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest?.("#drop"); if (d) d.classList.remove("on"); });
document.addEventListener("drop", e => { const d = e.target.closest?.("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("on"); handleFiles([...e.dataTransfer.files]); });
window.addEventListener("beforeunload", () => saveAll(true));
